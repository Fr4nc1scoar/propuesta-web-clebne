<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLEBNE - Editor Visual de Noticias</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --editor-bg: #f8fafc;
            --primary-blue: #0f172a;
            --gold-accent: #ca8a04;
        }

        body {
            background-color: var(--editor-bg);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding-top: 75px;
            color: #1e293b;
        }

        /* Fixed Top Action Header */
        .editor-topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: #0f172a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 2000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .editor-topbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 16px;
        }

        .editor-topbar-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-topbar {
            padding: 9px 20px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-topbar-cancel {
            background: #475569;
            color: white;
        }
        .btn-topbar-cancel:hover { background: #334155; }

        .btn-topbar-draft {
            background: #0284c7;
            color: white;
        }
        .btn-topbar-draft:hover { background: #0369a1; }

        .btn-topbar-publish {
            background: #d97706;
            color: white;
        }
        .btn-topbar-publish:hover { background: #b45309; }

        /* Article Workspace Container */
        .article-editor-container {
            max-width: 850px;
            margin: 30px auto 60px auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        /* Hero Image Container */
        .featured-image-box {
            width: 100%;
            height: 380px;
            background-size: cover;
            background-position: center;
            background-color: #cbd5e1;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 20px;
        }

        .image-overlay-controls {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            padding: 10px 18px;
            border-radius: 10px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .image-overlay-controls label, .image-overlay-controls button {
            color: white;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            background: transparent;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .image-overlay-controls label:hover, .image-overlay-controls button:hover { color: #fef08a; }

        /* Article Main Content Padding */
        .article-content-padding {
            padding: 40px;
        }

        /* Meta Controls */
        .meta-editor-row {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f1f5f9;
        }

        .meta-select {
            padding: 7px 16px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            font-size: 13.5px;
            font-weight: 700;
            color: #0369a1;
            outline: none;
            cursor: pointer;
        }

        .meta-date-input {
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 13.5px;
            color: #64748b;
            outline: none;
        }

        /* Editable Title */
        .title-editable {
            font-size: 32px;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.35;
            margin-bottom: 25px;
            outline: none;
            border-bottom: 2px dashed #cbd5e1;
            padding: 6px 0;
            transition: border-color 0.2s;
        }
        .title-editable:focus {
            border-bottom-color: #d97706;
            background: #fffbeb;
        }
        .title-editable[data-placeholder]:empty:before {
            content: attr(data-placeholder);
            color: #94a3b8;
        }

        /* Sticky Visual Formatting Toolbar */
        .visual-toolbar {
            position: sticky;
            top: 85px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 1000;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 4px;
            padding-right: 8px;
            border-right: 1px solid #e2e8f0;
        }
        .tool-group:last-child {
            border-right: none;
        }

        .tool-select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 12.5px;
            font-weight: 600;
            color: #334155;
            background: #f8fafc;
            outline: none;
            cursor: pointer;
        }

        .btn-tool {
            padding: 6px 10px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            color: #334155;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            height: 32px;
        }
        .btn-tool:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .btn-tool-photo {
            background: #fef3c7;
            color: #78350f;
            border-color: #fde68a;
            min-width: auto;
            padding: 0 14px;
            height: 32px;
            font-size: 12.5px;
        }
        .btn-tool-photo:hover {
            background: #fde68a;
        }

        /* Body Editable Area */
        .body-editable {
            min-height: 350px;
            outline: none;
            font-size: 17px;
            line-height: 1.8;
            color: #334155;
            padding: 10px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .body-editable:focus {
            background: #fafafa;
        }
        .body-editable[data-placeholder]:empty:before {
            content: attr(data-placeholder);
            color: #94a3b8;
        }

        .body-editable h1 { font-size: 28px; font-weight: 800; color: #0f172a; margin: 20px 0 10px 0; }
        .body-editable h2 { font-size: 24px; font-weight: 800; color: #0369a1; margin: 20px 0 10px 0; }
        .body-editable h3 { font-size: 20px; font-weight: 800; color: #0f172a; margin: 18px 0 8px 0; }
        .body-editable p { margin-bottom: 16px; }

        /* Toast notification */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #0f172a;
            color: white;
            padding: 14px 24px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .toast-notification.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Top Action Header Bar -->
    <header class="editor-topbar">
        <div class="editor-topbar-brand">
            <i class="fas fa-edit" style="color:#f59e0b; font-size:20px;"></i>
            <span>CLEBNE Editor Visual de Noticias</span>
            <span style="font-size:11.5px; background:#334155; padding:3px 10px; border-radius:12px; font-weight:600; color:#94a3b8;">Modo Pagina Publica</span>
        </div>
        <div class="editor-topbar-actions">
            <button class="btn-topbar btn-topbar-cancel" onclick="returnToAdmin()">
                <i class="fas fa-arrow-left"></i> Volver al Panel
            </button>
            <button class="btn-topbar btn-topbar-draft" onclick="saveArticle('Borrador')">
                <i class="fas fa-save"></i> Guardar como Borrador
            </button>
            <button class="btn-topbar btn-topbar-publish" onclick="saveArticle('Publicada')">
                <i class="fas fa-paper-plane"></i> Publicar en la Web
            </button>
        </div>
    </header>

    <!-- Main Editable Article Page -->
    <main class="article-editor-container">
        
        <!-- Hero Featured Image -->
        <div id="featuredImgBox" class="featured-image-box" style="background-image: url('Clebne_2024.jpeg');">
            <div class="image-overlay-controls">
                <label>
                    <i class="fas fa-camera"></i> Subir Imagen Principal
                    <input type="file" id="featuredImgFile" accept="image/*" style="display:none;" onchange="handleFeaturedImgUpload(event)">
                </label>
                <span style="color:#64748b;">|</span>
                <button type="button" onclick="promptImageURL()">
                    <i class="fas fa-link"></i> URL de Imagen
                </button>
            </div>
        </div>

        <div class="article-content-padding">
            
            <!-- Meta Information Bar -->
            <div class="meta-editor-row">
                <div>
                    <i class="fas fa-tag" style="color:#ef4444; margin-right:6px;"></i>
                    <select id="articleCategory" class="meta-select">
                        <option value="Legislación">Legislación</option>
                        <option value="Acuerdos">Acuerdos</option>
                        <option value="Institucional">Institucional</option>
                        <option value="Sesiones">Sesiones Especiales</option>
                    </select>
                </div>
                <div>
                    <i class="far fa-calendar-alt" style="color:#ef4444; margin-right:6px;"></i>
                    <input type="date" id="articleDate" class="meta-date-input">
                </div>
            </div>

            <!-- Editable Title -->
            <h1 id="articleTitle" class="title-editable" contenteditable="true" data-placeholder="Escriba aquí el Titular de la Noticia..."></h1>

            <!-- Sticky Visual Format Toolbar -->
            <div class="visual-toolbar">
                <!-- Group 1: Format & Heading -->
                <div class="tool-group">
                    <select class="tool-select" onchange="applyBlockFormat(this.value); this.value='';">
                        <option value="">Tipo de Texto...</option>
                        <option value="p">Texto Normal (Párrafo)</option>
                        <option value="h1">Título Grande (H1)</option>
                        <option value="h2">Título Mediano (H2)</option>
                        <option value="h3">Subtítulo (H3)</option>
                    </select>
                    
                    <select class="tool-select" onchange="applyFontSize(this.value); this.value='';">
                        <option value="">Tamaño Letra...</option>
                        <option value="14px">14px - Pequeña</option>
                        <option value="16px">16px - Normal</option>
                        <option value="18px">18px - Mediana</option>
                        <option value="22px">22px - Grande</option>
                        <option value="28px">28px - Enorme</option>
                    </select>
                </div>

                <!-- Group 2: Inline Formats -->
                <div class="tool-group">
                    <button type="button" class="btn-tool" onclick="execCmd('bold')" title="Negrita"><b>B</b></button>
                    <button type="button" class="btn-tool" onclick="execCmd('italic')" title="Cursiva"><i>I</i></button>
                    <button type="button" class="btn-tool" onclick="execCmd('underline')" title="Subrayado"><u>U</u></button>
                    <button type="button" class="btn-tool" onclick="execCmd('strikeThrough')" title="Tachado"><s>S</s></button>
                </div>

                <!-- Group 3: Text Alignment -->
                <div class="tool-group">
                    <button type="button" class="btn-tool" onclick="execCmd('justifyLeft')" title="Alinear a la Izquierda"><i class="fas fa-align-left"></i></button>
                    <button type="button" class="btn-tool" onclick="execCmd('justifyCenter')" title="Centrar Texto"><i class="fas fa-align-center"></i></button>
                    <button type="button" class="btn-tool" onclick="execCmd('justifyRight')" title="Alinear a la Derecha"><i class="fas fa-align-right"></i></button>
                    <button type="button" class="btn-tool" onclick="execCmd('justifyFull')" title="Justificar Texto"><i class="fas fa-align-justify"></i></button>
                </div>

                <!-- Group 4: Color & Lists -->
                <div class="tool-group">
                    <label title="Color de Texto" style="display:inline-flex; align-items:center; gap:4px; cursor:pointer; background:#f1f5f9; padding:4px 8px; border-radius:6px; border:1px solid #cbd5e1; font-size:12px; font-weight:700;">
                        <i class="fas fa-palette" style="color:#ca8a04;"></i> Color
                        <input type="color" onchange="execCmd('foreColor', this.value)" style="width:20px; height:20px; border:none; background:none; cursor:pointer; padding:0;">
                    </label>
                    <button type="button" class="btn-tool" onclick="execCmd('insertUnorderedList')" title="Lista con Viñetas"><i class="fas fa-list-ul"></i></button>
                    <button type="button" class="btn-tool" onclick="execCmd('insertOrderedList')" title="Lista Numerada"><i class="fas fa-list-ol"></i></button>
                </div>

                <!-- Group 5: Photos & Separator -->
                <div class="tool-group">
                    <button type="button" class="btn-tool" onclick="execCmd('insertHorizontalRule')" title="Línea Separadora"><i class="fas fa-minus"></i></button>
                    <label class="btn-tool btn-tool-photo" title="Insertar fotografía en la posición exacta del cursor">
                        <i class="fas fa-camera"></i> Insertar Foto en Cursor
                        <input type="file" accept="image/*" style="display:none;" onchange="insertInlineImage(event)">
                    </label>
                </div>
            </div>

            <!-- Editable Body Canvas -->
            <div id="articleBody" class="body-editable" contenteditable="true" data-placeholder="Comience a redactar la noticia aquí. Puede aplicar formatos de texto, ajustar tamaños e insertar fotografías donde desee..."></div>

            <!-- Footer Action Link Preview -->
            <div style="margin-top:40px; padding-top:20px; border-top:1px solid #f1f5f9; color:#0369a1; font-weight:700;">
                <i class="fas fa-arrow-left"></i> Volver a Noticias
            </div>

        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast-notification">
        <i class="fas fa-check-circle" style="color:#f59e0b; font-size:20px;"></i>
        <span id="toastText">Noticia guardada con éxito.</span>
    </div>

    <script>
        let currentArticleId = null;
        let featuredImageBase64 = "Clebne_2024.jpeg";

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            currentArticleId = params.get('id');

            document.getElementById('articleDate').valueAsDate = new Date();

            if (currentArticleId) {
                loadArticleData(currentArticleId);
            }
        };

        function loadArticleData(id) {
            const news = JSON.parse(localStorage.getItem('clebne_news')) || [];
            const article = news.find(n => n.id === id);
            if (!article) return;

            document.getElementById('articleTitle').innerText = article.title || '';
            document.getElementById('articleCategory').value = article.category || 'Legislación';
            if (article.date) document.getElementById('articleDate').value = article.date;

            if (article.image) {
                featuredImageBase64 = article.image;
                document.getElementById('featuredImgBox').style.backgroundImage = `url('${article.image}')`;
            }

            if (article.content) {
                document.getElementById('articleBody').innerHTML = article.content;
            }
        }

        function handleFeaturedImgUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                featuredImageBase64 = evt.target.result;
                document.getElementById('featuredImgBox').style.backgroundImage = `url('${featuredImageBase64}')`;
                showToast('Imagen destacada actualizada.');
            };
            reader.readAsDataURL(file);
        }

        function promptImageURL() {
            const url = prompt('Ingrese la URL de la imagen destacada:', featuredImageBase64);
            if (url && url.trim()) {
                featuredImageBase64 = url.trim();
                document.getElementById('featuredImgBox').style.backgroundImage = `url('${featuredImageBase64}')`;
                showToast('Imagen destacada actualizada mediante URL.');
            }
        }

        function execCmd(cmd, val = null) {
            document.execCommand(cmd, false, val);
        }

        function applyBlockFormat(tag) {
            if (!tag) return;
            document.execCommand('formatBlock', false, '<' + tag + '>');
        }

        function applyFontSize(px) {
            if (!px) return;
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return;

            const range = selection.getRangeAt(0);
            const span = document.createElement('span');
            span.style.fontSize = px;
            
            try {
                range.surroundContents(span);
            } catch(e) {
                document.execCommand('fontSize', false, '4');
            }
        }

        function insertInlineImage(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const base64 = evt.target.result;
                const body = document.getElementById('articleBody');
                body.focus();

                const imgHtml = `
                    <div contenteditable="false" style="text-align:center; margin:25px 0; position:relative; display:block; user-select:none;">
                        <img src="${base64}" style="max-width:100%; max-height:450px; border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,0.15); display:block; margin:0 auto;">
                        <p contenteditable="true" style="font-size:13px; color:#64748b; margin-top:8px; font-style:italic; outline:none;" placeholder="Pie de foto...">Pie de foto (haga clic para editar)</p>
                        <button type="button" onclick="this.parentElement.remove();" style="position:absolute; top:10px; right:10px; background:#ef4444; color:white; border:none; border-radius:50%; width:30px; height:30px; cursor:pointer; font-size:15px; font-weight:bold; line-height:30px; box-shadow:0 3px 8px rgba(0,0,0,0.3);">&times;</button>
                    </div>
                    <p><br></p>
                `;

                document.execCommand('insertHTML', false, imgHtml);
                showToast('Fotografía insertada exactamente en el artículo.');
            };
            reader.readAsDataURL(file);
        }

        function saveArticle(status) {
            const title = document.getElementById('articleTitle').innerText.trim();
            const category = document.getElementById('articleCategory').value;
            const date = document.getElementById('articleDate').value;
            const content = document.getElementById('articleBody').innerHTML.trim();

            if (!title) {
                alert('Por favor ingrese el titular de la noticia.');
                document.getElementById('articleTitle').focus();
                return;
            }

            const news = JSON.parse(localStorage.getItem('clebne_news')) || [];
            
            const newObj = {
                id: currentArticleId ? currentArticleId : 'news-' + Date.now(),
                title: title,
                category: category,
                date: date || new Date().toISOString().split('T')[0],
                image: featuredImageBase64 || 'Clebne_2024.jpeg',
                content: content,
                status: status || 'Publicada'
            };

            if (currentArticleId) {
                const idx = news.findIndex(n => n.id === currentArticleId);
                if (idx !== -1) news[idx] = newObj;
            } else {
                news.unshift(newObj);
            }

            localStorage.setItem('clebne_news', JSON.stringify(news));
            showToast(status === 'Borrador' ? 'Guardado como borrador.' : '¡Noticia publicada exitosamente!');

            setTimeout(() => {
                window.location.href = 'admin.html#noticias';
            }, 1200);
        }

        function returnToAdmin() {
            if (confirm('¿Desea salir del editor y volver al panel? Los cambios no guardados se perderán.')) {
                window.location.href = 'admin.html#noticias';
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastText').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
