<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Intranet - CLEBNE</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: var(--navy-dark);
            background-image: radial-gradient(circle at 50% 30%, rgba(197, 155, 39, 0.15), transparent 70%),
                              linear-gradient(135deg, #071931 0%, #0b2545 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background: var(--white);
            padding: 45px 35px;
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            border: 1px solid rgba(197, 155, 39, 0.3);
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--gold-gradient);
            border-top-left-radius: var(--radius-lg);
            border-top-right-radius: var(--radius-lg);
        }
        .login-logo {
            width: 100px;
            height: auto;
            max-height: 100px;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        }
        .login-title {
            color: var(--primary-blue);
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .login-subtitle {
            color: var(--muted-text);
            font-size: 13.5px;
            margin-bottom: 25px;
            font-weight: 500;
        }
        .alert-box {
            padding: 12px 15px;
            border-radius: var(--radius-md);
            font-size: 13.5px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            text-align: left;
            align-items: center;
            gap: 10px;
        }
        .alert-danger {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .alert-warning {
            background-color: #fffbeb;
            color: #92400e;
            border: 1px solid #fde68a;
        }
        .alert-success {
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--dark-text);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i.icon-left {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted-text);
            font-size: 15px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 40px 12px 42px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14.5px;
            outline: none;
            transition: all 0.3s;
            background: #f8fafc;
        }
        .input-group input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 3.5px rgba(197, 155, 39, 0.15);
            background: white;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--muted-text);
            cursor: pointer;
            padding: 4px;
            font-size: 14px;
        }
        .toggle-password:hover {
            color: var(--primary-blue);
        }
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 22px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted-text);
            cursor: pointer;
            font-weight: 500;
        }
        .remember-me input {
            accent-color: var(--gold-primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .help-link {
            color: var(--primary-blue);
            font-weight: 600;
            text-decoration: none;
        }
        .help-link:hover { text-decoration: underline; }
        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 15.5px;
            justify-content: center;
        }
        .credentials-hint {
            margin-top: 25px;
            padding: 12px;
            background: #f8fafc;
            border-radius: var(--radius-md);
            border: 1px dashed var(--border-color);
            font-size: 12px;
            color: var(--muted-text);
            text-align: left;
        }
        .credentials-hint strong { color: var(--primary-blue); }
        .shake {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 13.5px;
            color: var(--muted-text);
            font-weight: 600;
        }
        .back-link:hover { color: var(--gold-dark); }
    </style>
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

    <div class="login-card" id="loginCard">
        <img src="Logo.png" alt="CLEBNE" class="login-logo" onerror="this.src='https://via.placeholder.com/100?text=CLEBNE';">
        <h2 class="login-title">Acceso a la Intranet</h2>
        <p class="login-subtitle">Sistema Integrado de Gestión Legislativa CLEBNE</p>

        <!-- Mensajes de Estado / Error -->
        <div id="alertBox" class="alert-box">
            <i class="fas fa-exclamation-circle"></i>
            <span id="alertMessage">Usuario o contraseña incorrectos.</span>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">Usuario Institucional</label>
                <div class="input-wrapper">
                    <i class="fas fa-user icon-left"></i>
                    <input type="text" id="username" placeholder="Ej. admin" required autocomplete="username">
                </div>
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña de Seguridad</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock icon-left"></i>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Mostrar/ocultar contraseña">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="options-row">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <span>Recordar sesión</span>
                </label>
                <a href="#" onclick="alert('Contacte al departamento de Tecnología de CLEBNE para restablecer sus credenciales institucionales.'); return false;" class="help-link">¿Olvidó su clave?</a>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-gold btn-login">
                <i class="fas fa-shield-alt"></i> Iniciar Sesión Segura
            </button>
        </form>

        <div class="credentials-hint">
            <i class="fas fa-info-circle" style="color: var(--gold-dark); margin-right: 4px;"></i>
            <strong>Credenciales Demo:</strong><br>
            • Usuario: <code>admin</code> | Clave: <code>clebne2026</code><br>
            • Usuario: <code>prensa</code> | Clave: <code>clebne2026</code>
        </div>

        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver al Portal Público</a>
    </div>

    <script>
        // Cuentas válidas registradas en el sistema
        const VALID_USERS = {
            "admin": {
                name: "Msc. Jennyffer Gil",
                role: "Presidente del CLEBNE",
                avatar: "JG",
                password: "clebne2026",
                level: "SuperAdmin"
            },
            "presidente": {
                name: "Msc. Jennyffer Gil",
                role: "Despacho de Presidencia",
                avatar: "JG",
                password: "clebne2026",
                level: "Presidencia"
            },
            "vicepresidente": {
                name: "Tirso Solano",
                role: "Despacho de Vicepresidencia",
                avatar: "TS",
                password: "clebne2026",
                level: "Vicepresidencia"
            },
            "prensa": {
                name: "Dirección de Prensa CLEBNE",
                role: "Unidad de Comunicaciones",
                avatar: "DP",
                password: "clebne2026",
                level: "Editor"
            }
        };

        let failedAttempts = 0;
        let isLocked = false;

        // Verificar si la URL trae un parámetro de aviso
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const alertBox = document.getElementById('alertBox');
            const alertMsg = document.getElementById('alertMessage');

            if (urlParams.get('unauthorized') === 'true') {
                alertBox.className = 'alert-box alert-warning';
                alertMsg.innerText = 'Acceso denegado: Debe iniciar sesión para ingresar a la Intranet.';
                alertBox.style.display = 'flex';
            } else if (urlParams.get('session') === 'expired') {
                alertBox.className = 'alert-box alert-warning';
                alertMsg.innerText = 'Su sesión ha caducado por inactividad. Por favor ingrese nuevamente.';
                alertBox.style.display = 'flex';
            }

            // Si ya hay sesión activa guardada, dar opción o redirigir
            const existingSession = sessionStorage.getItem('clebne_auth_session') || localStorage.getItem('clebne_auth_session');
            if (existingSession) {
                try {
                    const session = JSON.parse(existingSession);
                    if (session && session.authenticated) {
                        alertBox.className = 'alert-box alert-success';
                        alertMsg.innerHTML = `Sesión activa detectada (${session.name}). <a href="admin.html" style="font-weight:700; color:inherit; text-decoration:underline;">Ir al Panel</a>`;
                        alertBox.style.display = 'flex';
                    }
                } catch(e) {}
            }
        });

        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.className = 'fas fa-eye-slash';
            } else {
                passInput.type = 'password';
                eyeIcon.className = 'fas fa-eye';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            if (isLocked) return;

            const usernameInput = document.getElementById('username').value.trim().toLowerCase();
            const passwordInput = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const alertBox = document.getElementById('alertBox');
            const alertMsg = document.getElementById('alertMessage');
            const card = document.getElementById('loginCard');
            const submitBtn = document.getElementById('submitBtn');

            const userObj = VALID_USERS[usernameInput];

            if (userObj && userObj.password === passwordInput) {
                // EXITO: Guardar sesión segura
                const sessionData = {
                    authenticated: true,
                    username: usernameInput,
                    name: userObj.name,
                    role: userObj.role,
                    avatar: userObj.avatar,
                    level: userObj.level,
                    loginTime: new Date().toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit' }),
                    token: 'clebne-auth-' + Math.random().toString(36).substring(2, 12)
                };

                const sessionStr = JSON.stringify(sessionData);
                if (rememberMe) {
                    localStorage.setItem('clebne_auth_session', sessionStr);
                } else {
                    sessionStorage.setItem('clebne_auth_session', sessionStr);
                }

                alertBox.className = 'alert-box alert-success';
                alertMsg.innerText = '¡Autenticación exitosa! Redirigiendo al panel...';
                alertBox.style.display = 'flex';
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Accediendo...';

                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 800);

            } else {
                // ERROR: Credenciales inválidas
                failedAttempts++;
                card.classList.remove('shake');
                void card.offsetWidth; // Force reflow
                card.classList.add('shake');

                alertBox.className = 'alert-box alert-danger';
                if (failedAttempts >= 5) {
                    isLocked = true;
                    alertMsg.innerText = 'Demasiados intentos fallidos. Bloqueado temporalmente por 30 segundos.';
                    submitBtn.disabled = true;
                    let countdown = 30;
                    const timer = setInterval(() => {
                        countdown--;
                        submitBtn.innerText = `Bloqueado (${countdown}s)`;
                        if (countdown <= 0) {
                            clearInterval(timer);
                            isLocked = false;
                            failedAttempts = 0;
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = '<i class="fas fa-shield-alt"></i> Iniciar Sesión Segura';
                            alertBox.style.display = 'none';
                        }
                    }, 1000);
                } else {
                    alertMsg.innerText = `Credenciales incorrectas. Intento ${failedAttempts} de 5.`;
                }
                alertBox.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
